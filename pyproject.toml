[project]
name = "dllm-grpo"
version = "0.1.0"
description = "把推理加速塞进扩散语言模型的强化学习循环"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
